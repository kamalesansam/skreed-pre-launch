<body>
<canvas id="c"></canvas>
<div id="labels" aria-hidden="true"><svg id="leaders"></svg></div>
<nav aria-label="Stone look">
  <button data-look="D">Igloo exact</button><button data-look="A">Gem A</button><button data-look="B">Gem B</button><button data-look="C">Gem C</button>
</nav>
<script type="module">
// Section 2 stone look development. Four looks on one page, our own code throughout (igloo was measured, never copied):
//  D  igloo exact: crushed ice block (our surface-nets geometry with igloo's measured shape statistics), igloo's measured
//     pipeline re-written (two-pass screen-space refraction, 3 samples, per-channel IOR split, roughness-scaled mip,
//     frost roughness and crushed-facet normals, env-only lighting from our fitted overcast sky, our fitted grade, bloom 0.2)
//  A  polished faceted gem on three's own MeshPhysicalMaterial transmission (ior, thickness, dispersion, clearcoat), emissive core
//  B  igloo's two-pass refraction adapted to polished gems: back faces with total internal reflection, per-channel IOR, crisp glints
//  C  faceted gem: screen-space refraction of the background, internal reflections traced against its own facet planes, luminous core
// Query: look=D|A|B|C  mode=field|close  shade=<name>  t=<s>  capture  dpr=<n>
import * as THREE from 'three';

const Q = new URLSearchParams(location.search);
const LOOKS = ['D', 'A', 'B', 'C'];
const HQ = new URLSearchParams(location.hash.slice(1));
let LOOK = (Q.get('look') || HQ.get('look') || 'C').toUpperCase(); if (!LOOKS.includes(LOOK)) LOOK = 'C';
const MODE = Q.get('mode') === 'close' ? 'close' : 'field';
const CAPTURE = Q.has('capture');
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const T_START = Q.has('t') ? +Q.get('t') : 7.0;
if (CAPTURE) document.body.classList.add('capture');
if (MODE === 'close') document.body.classList.add('close');
document.querySelectorAll('nav button').forEach((b) => {
  b.setAttribute('aria-pressed', String(b.dataset.look === LOOK));
  b.addEventListener('click', () => { location.hash = 'look=' + b.dataset.look; location.reload(); });
});

// ---------------------------------------------------------------- data
// catalog order j: family, display shade, hex (docs/data/shades-240.json), the hero block it came from
const FAM = [['Frosty Whites', 'Snow', '#f0f4f5', 2], ['Blissful Blues', 'Sky', '#08bcf4', 3], ['Playful Pinks', 'Rouge', '#f2638f', 7],
